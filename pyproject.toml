[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pktk-benchmark"
version = "0.1.0"
description = "Auditable public preclinical PK/TK collection and dose extrapolation pilot"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "requests>=2.32", "rdata>=1.0", "rdkit>=2024.3", "pypdf>=6", "openpyxl>=3.1", "scipy>=1.15", "matplotlib>=3.10"]
[project.optional-dependencies]
test = ["pytest>=8"]
ml = ["scikit-learn>=1.7", "xgboost>=3.0", "torch>=2.8", "torch-geometric>=2.6"]
[project.scripts]
pktk = "pktk.pipeline:main"
pktk-expand = "pktk.expansion:main"
pktk-molecular = "pktk.molecular:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
